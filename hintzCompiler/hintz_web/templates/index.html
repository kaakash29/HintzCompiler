<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HintzCompiler Web</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background-color: #f9f9f9;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    header img {
      height: 60px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      color: #333;
    }
    textarea {
      width: 100%;
      font-family: monospace;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    pre {
      background-color: #eee;
      padding: 1rem;
      border-radius: 4px;
      overflow: auto;
    }
    object {
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="/static/hintz-logo.png" alt="Hintz Logo">
    <h1>HintzCompiler Testbed</h1>
  </header>

  <form method="post">
    <textarea name="code" rows="20" cols="80">{{ request.form.code or '' }}</textarea><br>
    <button type="submit" name="action" value="ast">Generate IR</button>
    <button type="submit" name="action" value="cfg">Show CFG</button>
    <button type="submit" name="action" value="bbg">Show BBG</button>
    <button type="submit" name="action" value="dmt">Show DomT</button>
    <button type="submit" name="action" value="toSSA">Show CFG toSSA</button>
  </form>

  {% if ir_output %}
    <h2>IR Output</h2>
    <pre>{{ ir_output }}</pre>
  {% endif %}

  {% if cfg_generated %}
    <h2>Output</h2>
    <object type="image/svg+xml" data="/static/cfg.svg" width="100%" height="600px">
      Your browser does not support SVG.
    </object>
  {% endif %}
</body>
</html>
