<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HintzCompiler Web</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background-color: #f9f9f9;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    header img {
      height: 60px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      color: #333;
    }
    textarea {
      width: 100%;
      font-family: monospace;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    button {
      height: 42px;
      min-width: 140px;
      padding: 0 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #1f2937;
      border-radius: 6px;
      background-color: #ffffff;
      color: #1f2937;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    button:hover {
      background-color: #f3f4f6;
    }
    button:active {
      transform: translateY(1px);
    }
    .actions {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    pre {
      background-color: #eee;
      padding: 1rem;
      border-radius: 4px;
      overflow: auto;
    }
    object {
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="/static/hintz-logo.png" alt="Hintz Logo">
    <h1>HintzCompiler Testbed</h1>
  </header>

  <form method="post">
    <textarea id="code-input" name="code" rows="20" cols="80">{{ request.form.code or default_code }}</textarea><br>
    <div class="actions">
      <button id="random-sample-btn" type="button" title="Load random sample from tests">🎲 Random Sample</button>
      <button type="submit" name="action" value="ast">Show AST</button>
      <button type="submit" name="action" value="rwa">Show R/W</button>
      <button type="submit" name="action" value="cfg">Show CFG</button>
      <button type="submit" name="action" value="bbg">Show BBG</button>
      <button type="submit" name="action" value="dmt">Show DOM</button>
      <button type="submit" name="action" value="toSSA">Run toSSA</button>
      <button type="submit" name="action" value="ssaDCE">Run ssaDCE</button>
      <button type="submit" name="action" value="mlir">Show MLIR</button>
    </div>
  </form>

  {% if ir_output %}
    <h2>Textual Output</h2>
    <pre>{{ ir_output }}</pre>
  {% endif %}

  {% if cfg_generated %}
    <h2>Graphical Output</h2>
    <object type="image/svg+xml" data="/static/cfg.svg" width="100%" height="600px">
      Your browser does not support SVG.
    </object>
  {% endif %}

  <script>
    document.getElementById("random-sample-btn").addEventListener("click", async () => {
      const response = await fetch("/random-sample");
      if (!response.ok) {
        alert("Could not load a sample program.");
        return;
      }
      const payload = await response.json();
      document.getElementById("code-input").value = payload.code || "";
    });
  </script>
</body>
</html>
