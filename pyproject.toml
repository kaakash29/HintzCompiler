[project]
name = "hintzcompiler"
version = "0.1.0"
description = "C89-inspired compiler for the Hintz language"
authors = [
    { name="Kumar Aakash" }
]
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1.5",
    "graphviz>=0.20",
    "ordered-set>=4.1",
    "flask>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "lit>=18"]

[project.scripts]
hintz = "hintzCompiler.compiler:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hintzCompiler", "hintzCompiler.src", "hintzCompiler.hintz_web"]

[tool.setuptools.package-data]
hintzCompiler = ["grammar/*.lark", "hintz_web/templates/*.html"]
